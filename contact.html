<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="resources/favicon.png" type="image/x-icon">
    <script src="script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="background pastel-background-animated"></div>
    <header id="heading-root">
        <div class="no-js-warning">
            This site uses javascript to allow reuse of header and footer elements, please either enable it, or view the site through a live server.
        </div>
    </header>

    <main>
        <h1>Links</h1>
        <div class="links-grid">
            <a title="Github"   class="github"   href="https://github.com/YourUnravelling"      ><img src="resources/socials/github.svg" alt="Github Logo"></a>
            <a title="LinkedIn" class="linkedin" href="https://github.com/YourUnravelling"      ><img src="resources/socials/linkedin.svg" alt="Linkedin Logo"></a>
            <a title="Email"    class="email"    href="mailto:conneljmh@hotmail.com"            ><img src="resources/socials/email.svg"></a>
            <a title="Matrix"   class="matrix"   href="mailto:conneljmh@hotmail.com"            ><img src="resources/socials/email.svg"></a>
        </div>
        <h1>Contact</h1>        
        <div class="panel">
            <form class="contact-grid" action="mailto:conneljmh@hotmail.com" method="get">

                <label class="type-desc" for="communicationType">Communication type</label>
                <select class="type" name="communicationType" id="communicationType">
                    <option value="1">Praise</option>
                    <option value="1">Complaint</option>
                    <option value="2">Sexual advance</option>
                </select>

                <textarea class="message" name="message" placeholder="Message"></textarea>

                <label class="email-desc" for="email">Email</label>
                <input class="email" name="email" id="email" type="email" required>

                <label class="hivel-desc" for="high-velocity">High velocity (message will be sent at high velocity and may hurt Autumn when it hits her)</label>
                <input class="hivel" type="checkbox" id="high-velocity"> 

                <input class="submit" type="button" value="Submit">
            </form>
        </div>

    </main>
    <footer id="footer-root">
        <div class="footer-bar"></div>
        <div class="footer-bg"></div>
    </footer>
</body>
</html>
